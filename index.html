<!DOCTYPE html>
<html>
<head>
    <title>Capybara Clicker: Summer Glitch</title>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; user-select: none; }
        #game-container { position: relative; width: 100%; height: 100%; background: linear-gradient(#87CEEB, #E0F7FA); transition: background 0.5s; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 15px; left: 0; width: 100%; z-index: 10; text-align: center; pointer-events: none; }
        .stat-box { display: inline-block; background: rgba(255,255,255,0.8); padding: 10px 20px; border: 3px solid #5d4037; border-radius: 15px; font-size: 24px; color: #5d4037; font-weight: bold; margin: 0 10px; }
        #phase-msg { font-size: 45px; color: #fff; font-weight: bold; text-shadow: 3px 3px 0 #5d4037; margin-top: 20px; }
        #menu { position: relative; z-index: 20; text-align: center; background: white; padding: 40px; border: 6px solid #8d6e63; border-radius: 30px; margin: auto; box-shadow: 0 10px 0 #5d4037; }
        button { padding: 20px 50px; font-size: 28px; background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 20px; box-shadow: 0 6px 0 #2E7D32; font-weight: bold; }
        button:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #2E7D32; }
        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #2E7D32; }
        .grass { position: absolute; bottom: 0; width: 100%; height: 100px; background: #7CFC00; z-index: 0; border-top: 10px solid #556B2F; }
    </style>
</head>
<body style="display: flex; justify-content: center; align-items: center;">

    <div id="game-container">
        <div id="ui">
            <div class="stat-box">KERROIN: x<span id="multiplier">1</span></div>
            <div class="stat-box">PISTEET: <span id="score">0</span></div>
            <div class="stat-box">AIKA: <span id="timer">55</span>s</div>
            <div id="phase-msg"></div>
        </div>

        <div id="menu">
            <h1 style="color: #8d6e63;">CAPYBARA CLICKER</h1>
            <div id="statsDisplay" style="display:none;">
                <h2 id="finalScoreText"></h2>
                <p id="rewardText" style="color: #4CAF50;"></p>
            </div>
            <p>1. Kerää tippuvia 💩-emojeja (Kerroin)<br>2. <b>RÄMPYTÄ CAPYBARAA</b> lopussa!</p>
            <button id="playBtn">ALOITA!</button>
        </div>
        
        <div class="grass"></div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("game-container");
        const scoreEl = document.getElementById("score");
        const multEl = document.getElementById("multiplier");
        const timerEl = document.getElementById("timer");
        const phaseEl = document.getElementById("phase-msg");
        const playBtn = document.getElementById("playBtn");
        const menu = document.getElementById("menu");

        let width, height, score, multiplier, timeLeft, gameActive, items, lastTime, magnetTime = 0, nyanMode = 0;
        let capySize = 1;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class FallingItem {
            constructor(type) {
                this.type = type; // 'poop', 'gold', 'magnet'
                this.x = Math.random() * (width - 60) + 30;
                this.y = -50;
                this.speed = Math.random() * 3 + 2;
                this.r = 30;
                this.content = type === 'poop' ? "💩" : (type === 'gold' ? "✨💩" : "🧲");
            }
            update() {
                if (magnetTime > 0 && this.type !== 'magnet') {
                    let dx = mouseX - this.x;
                    let dy = mouseY - this.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 500) {
                        this.x += (dx / dist) * 15;
                        this.y += (dy / dist) * 15;
                    }
                }
                this.y += nyanMode > 0 ? this.speed * 2.5 : this.speed;
            }
            draw() {
                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.fillText(this.content, this.x, this.y);
            }
        }

        function update(time) {
            if (!gameActive) return;
            const dt = (time - lastTime) / 1000;
            lastTime = time;
            timeLeft -= dt;
            timerEl.innerText = Math.max(0, Math.ceil(timeLeft));

            if (timeLeft <= 0) return explodeCapy();

            // Vaiheiden hallinta
            if (timeLeft > 10) {
                phaseEl.innerText = nyanMode > 0 ? "NYAN MODE!!!" : "KERÄÄ KERROINTA!";
                
                // Random spawnit
                if (Math.random() < (nyanMode > 0 ? 0.3 : 0.08)) {
                    let r = Math.random();
                    if (r < 0.02) items.push(new FallingItem('magnet'));
                    else if (r < 0.15) items.push(new FallingItem('gold'));
                    else items.push(new FallingItem('poop'));
                }

                // Nyan Mode triggeri
                if (Math.random() < 0.005 && nyanMode <= 0) {
                    nyanMode = 5;
                    container.style.background = "repeating-linear-gradient(45deg, #ff0000, #ff0000 10%, #ff7f00 10%, #ff7f00 20%, #ffff00 20%, #ffff00 30%, #00ff00 30%, #00ff00 40%, #0000ff 40%, #0000ff 50%, #4b0082 50%, #4b0082 60%, #8b00ff 60%, #8b00ff 70%)";
                }
            } else {
                phaseEl.innerText = "RÄMPYTÄ!!!";
                container.style.background = "#FFD700";
                items = [];
                nyanMode = 0;
            }

            if (nyanMode > 0) nyanMode -= dt;
            else if (timeLeft > 10) container.style.background = "linear-gradient(#87CEEB, #E0F7FA)";
            
            if (magnetTime > 0) magnetTime -= dt;

            for (let i = items.length - 1; i >= 0; i--) {
                items[i].update();
                if (items[i].y > height + 50) items.splice(i, 1);
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            if (timeLeft > 10) {
                items.forEach(it => it.draw());
            } else {
                // Piirretään JÄTTI-CAPYBARA
                ctx.save();
                ctx.translate(width/2, height/2);
                ctx.scale(capySize, capySize);
                ctx.fillStyle = "#8d6e63";
                ctx.beginPath(); ctx.ellipse(0, 0, 150, 110, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(90, -35, 12, 0, Math.PI*2); ctx.fill();
                ctx.restore();
                if (capySize > 1) capySize -= 0.1;
            }
        }

        function explodeCapy() {
            gameActive = false;
            ctx.clearRect(0, 0, width, height);
            menu.style.display = "block";
            document.getElementById("statsDisplay").style.display = "block";
            document.getElementById("finalScoreText").innerText = "PISTEET: " + Math.floor(score);
            document.getElementById("rewardText").innerText = score > 10000 ? "MESTARI! 🏆" : "Hyvä suoritus!";
            playBtn.innerText = "PELAA UUDELLEEN";
        }

        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

        canvas.addEventListener('mousedown', (e) => {
            if (!gameActive) return;

            if (timeLeft > 10) {
                for (let i = items.length - 1; i >= 0; i--) {
                    let it = items[i];
                    if (Math.hypot(e.clientX - it.x, e.clientY - it.y) < 50) {
                        if (it.type === 'poop') multiplier += 1;
                        else if (it.type === 'gold') multiplier += 10;
                        else if (it.type === 'magnet') magnetTime = 5;
                        
                        multEl.innerText = multiplier;
                        items.splice(i, 1);
                    }
                }
            } else {
                let d = Math.hypot(e.clientX - width/2, e.clientY - height/2);
                if (d < 200 * capySize) {
                    score += multiplier;
                    scoreEl.innerText = Math.floor(score);
                    capySize = 1.3;
                }
            }
        });

        playBtn.addEventListener('click', () => {
            score = 0; multiplier = 1; timeLeft = 55; items = []; nyanMode = 0; magnetTime = 0;
            scoreEl.innerText = "0"; multEl.innerText = "1";
            menu.style.display = "none";
            gameActive = true;
            lastTime = performance.now();
            requestAnimationFrame(update);
        });
    </script>
</body>
</html>
