<!DOCTYPE html>
<html>
<head>
    <title>Capybara Clicker: Gamble Edition</title>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; user-select: none; }
        #game-container { position: relative; width: 100%; height: 100%; background: linear-gradient(#87CEEB, #E0F7FA); transition: background 0.5s; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 15px; left: 0; width: 100%; z-index: 10; text-align: center; pointer-events: none; }
        .stat-box { display: inline-block; background: rgba(255,255,255,0.8); padding: 10px 20px; border: 3px solid #5d4037; border-radius: 15px; font-size: 24px; color: #5d4037; font-weight: bold; margin: 0 10px; min-width: 150px; }
        #phase-msg { font-size: 45px; color: #fff; font-weight: bold; text-shadow: 3px 3px 0 #5d4037; margin-top: 20px; }
        #menu { position: relative; z-index: 20; text-align: center; background: white; padding: 40px; border: 6px solid #8d6e63; border-radius: 30px; margin: auto; box-shadow: 0 10px 0 #5d4037; max-width: 500px; }
        button { padding: 20px 50px; font-size: 22px; cursor: pointer; border-radius: 15px; font-weight: bold; margin: 10px; border: none; transition: 0.2s; }
        #playBtn { background: #4CAF50; color: white; box-shadow: 0 6px 0 #2E7D32; font-size: 28px; }
        #restartBtn { background: #f1c40f; color: #000; box-shadow: 0 5px 0 #b7950b; display: none; }
        .gamble-btn { background: #e74c3c; color: white; box-shadow: 0 6px 0 #c0392b; }
        .safe-btn { background: #3498db; color: white; box-shadow: 0 6px 0 #2980b9; }
        button:hover { transform: scale(1.05); }
        button:active { transform: translateY(3px); box-shadow: none; }
        .grass { position: absolute; bottom: 0; width: 100%; height: 100px; background: #7CFC00; z-index: 0; border-top: 10px solid #556B2F; }
        #party-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: none; }
        #gamble-screen { display: none; }
    </style>
</head>
<body style="display: flex; justify-content: center; align-items: center;">

    <div id="game-container">
        <div id="ui">
            <div class="stat-box">KERROIN: x<span id="multiplier">1.0</span></div>
            <div class="stat-box">PISTEET: <span id="score">0</span></div>
            <div class="stat-box">AIKA: <span id="timer">45</span>s</div>
            <div id="phase-msg"></div>
            <div id="weapon-status" style="color:#e67e22; font-weight:bold;"></div>
        </div>

        <div id="menu">
            <h1 id="main-title" style="color: #8d6e63; font-size: 2.5em; margin: 0;">CAPY CLICKER</h1>
            
            <div id="instructions">
                <p>Kerää kertoimia ja aseita. Lopussa voit <b>TUPLATA</b> kaiken!</p>
                <button id="playBtn">ALOITA!</button>
            </div>

            <div id="gamble-screen">
                <h2>KRUUNA VAI KLAAVA?</h2>
                <p>Uskallatko tuplata pisteesi vai voitko hävitä puolet?</p>
                <button class="gamble-btn" onclick="handleGamble()">TUPLAA TAI KUITTAA (50/50)</button>
                <button class="safe-btn" onclick="showResults()">OTA PISTEET TALTEEN</button>
            </div>

            <div id="statsDisplay" style="display:none;">
                <h2 id="finalScoreText" style="font-size: 3em; margin: 10px;">0</h2>
                <p id="rewardText" style="color: #4CAF50; font-size: 22px; font-weight: bold;"></p>
                <button id="restartBtn">PELAA UUDELLEEN</button>
            </div>
        </div>
        
        <div class="grass"></div>
        <canvas id="gameCanvas"></canvas>
        <canvas id="party-canvas"></canvas>
    </div>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const partyCanvas = document.getElementById("party-canvas");
        const pCtx = partyCanvas.getContext("2d");
        const container = document.getElementById("game-container");
        const scoreEl = document.getElementById("score");
        const multEl = document.getElementById("multiplier");
        const timerEl = document.getElementById("timer");
        const phaseEl = document.getElementById("phase-msg");
        const weaponEl = document.getElementById("weapon-status");
        const playBtn = document.getElementById("playBtn");
        const restartBtn = document.getElementById("restartBtn");
        const menu = document.getElementById("menu");
        const music = document.getElementById("bgMusic");

        let width, height, score, multiplier, timeLeft, gameActive, items, lastTime, magnetTime = 0, nyanMode = 0;
        let capySize = 1, mouseX = 0, mouseY = 0, goldenCapy = null, activeWeapon = null;
        let goldenCapySpawns = [38, 25, 15];

        function resize() {
            width = canvas.width = partyCanvas.width = window.innerWidth;
            height = canvas.height = partyCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class FallingItem {
            constructor(type) {
                this.type = type; this.x = Math.random() * (width - 60) + 30; this.y = -50;
                this.speed = Math.random() * 3 + 2.5; this.r = 30; this.collected = false;
                this.content = {poop:"💩", gold:"✨💩", magnet:"🧲", mine:"💣", mixer:"⚡", glove:"🥊"}[type];
            }
            update() {
                if (magnetTime > 0 && !['magnet', 'mine', 'mixer', 'glove'].includes(this.type)) {
                    let dx = mouseX - this.x; let dy = mouseY - this.y; let dist = Math.hypot(dx, dy);
                    if (dist < 450) { this.x += (dx/dist)*25; this.y += (dy/dist)*25; if (dist < 40) this.collect(); }
                }
                this.y += nyanMode > 0 ? this.speed * 2.2 : this.speed;
            }
            draw() { if (!this.collected) { ctx.font = "40px Arial"; ctx.textAlign = "center"; ctx.fillText(this.content, this.x, this.y); } }
            collect() {
                if (this.collected) return; this.collected = true;
                if (this.type === 'poop') multiplier += 0.2;
                else if (this.type === 'gold') multiplier += 2.0;
                else if (this.type === 'magnet') magnetTime = 6;
                else if (this.type === 'mine') { multiplier = Math.max(1.0, multiplier - 5.0); container.classList.add("shake"); setTimeout(()=>container.classList.remove("shake"), 200); }
                else if (this.type === 'mixer') { activeWeapon = 'mixer'; weaponEl.innerText = "⚡ SÄHKÖVATKAIN AKTIIVINEN"; }
                else if (this.type === 'glove') { activeWeapon = 'glove'; weaponEl.innerText = "🥊 KULTAINEN HANSKA AKTIIVINEN"; }
                multEl.innerText = multiplier.toFixed(1);
            }
        }

        function update(time) {
            if (!gameActive) return;
            const dt = (time - lastTime) / 1000; lastTime = time; timeLeft -= dt;
            timerEl.innerText = Math.max(0, Math.ceil(timeLeft));
            if (timeLeft <= 0) return startGamblePhase();

            if (timeLeft > 10) {
                phaseEl.innerText = nyanMode > 0 ? "NYAN MODE!!!" : (magnetTime > 0 ? "🧲 MAGNEETTI" : "KERÄÄ KERROINTA");
                if (Math.random() < (nyanMode > 0 ? 0.35 : 0.12)) {
                    let r = Math.random();
                    if (r < 0.005) items.push(new FallingItem('mixer'));
                    else if (r < 0.01) items.push(new FallingItem('glove'));
                    else if (r < 0.015) items.push(new FallingItem('magnet'));
                    else if (r < 0.12) items.push(new FallingItem('mine'));
                    else if (r < 0.25) items.push(new FallingItem('gold'));
                    else items.push(new FallingItem('poop'));
                }
                if (timeLeft < 30 && Math.random() < 0.003 && nyanMode <= 0) nyanMode = 6;
                if (goldenCapySpawns.length > 0 && timeLeft <= goldenCapySpawns[0]) { goldenCapySpawns.shift(); goldenCapy = { x: -100, y: height - 60, speed: 9.5 }; }
                if (goldenCapy) { goldenCapy.x += goldenCapy.speed; if (goldenCapy.x > width + 150) goldenCapy = null; }
            } else { phaseEl.innerText = "RÄMPYTÄ!!!"; container.style.background = "#FFD700"; items = []; goldenCapy = null; nyanMode = 0; }

            if (nyanMode > 0) { nyanMode -= dt; container.style.background = `hsl(${(Date.now()/5) % 360}, 70%, 60%)`; }
            else if (timeLeft > 10) { container.style.background = "linear-gradient(#87CEEB, #E0F7FA)"; }
            if (magnetTime > 0) magnetTime -= dt;
            for (let i = items.length - 1; i >= 0; i--) { items[i].update(); if (items[i].y > height + 60 || items[i].collected) items.splice(i, 1); }
            draw(); requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            if (timeLeft > 10) {
                items.forEach(it => it.draw());
                if (goldenCapy) {
                    ctx.save(); ctx.translate(goldenCapy.x, goldenCapy.y); ctx.fillStyle = "#FFD700";
                    ctx.beginPath(); ctx.ellipse(0, 0, 45, 33, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#FF0000"; ctx.beginPath(); ctx.moveTo(-10, -32); ctx.lineTo(0, -50); ctx.lineTo(10, -32); ctx.fill(); ctx.restore();
                }
            } else if (gameActive) {
                ctx.save(); ctx.translate(width/2, height/2); ctx.scale(capySize, capySize);
                ctx.fillStyle = "#8d6e63"; ctx.beginPath(); ctx.ellipse(0, 0, 160, 120, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(100, -40, 14, 0, Math.PI*2); ctx.fill();
                if (activeWeapon) { ctx.font = "50px Arial"; ctx.fillText(activeWeapon === 'mixer' ? "⚡" : "🥊", -130, -50); }
                ctx.restore(); if (capySize > 1) capySize -= 0.1;
            }
        }

        function startGamblePhase() {
            gameActive = false; music.pause();
            menu.style.display = "block";
            document.getElementById("instructions").style.display = "none";
            document.getElementById("gamble-screen").style.display = "block";
            phaseEl.innerText = "USKALLATKO TUPLATA?";
        }

        function handleGamble() {
            const win = Math.random() > 0.5;
            if (win) { score *= 2; alert("VOITIT! Pisteet tuplattu!"); }
            else { score /= 2; alert("HÄVISIT! Menetit puolet pisteistäsi."); }
            showResults();
        }

        function showResults() {
            document.getElementById("gamble-screen").style.display = "none";
            document.getElementById("statsDisplay").style.display = "block";
            document.getElementById("finalScoreText").innerText = Math.floor(score);
            if (score >= 100000) { document.getElementById("main-title").innerText = "✨ ULTIMATE CAPY GOD ✨"; startParty(); }
            else { document.getElementById("rewardText").innerText = "Tavoite: 100 000 pistettä!"; }
            setTimeout(() => { restartBtn.style.display = "inline-block"; }, 1000);
        }

        function startParty() {
            partyCanvas.style.display = "block"; let particles = [];
            for(let i=0; i<200; i++) particles.push({ x: Math.random()*width, y: Math.random()*height, s: Math.random()*6+2, c: `hsl(${Math.random()*360}, 100%, 50%)`, v: Math.random()*12+5 });
            function anim() { pCtx.clearRect(0, 0, width, height); particles.forEach(p => { p.y += p.v; if (p.y > height) p.y = -10; pCtx.fillStyle = p.c; pCtx.fillRect(p.x, p.y, p.s, p.s); }); if (partyCanvas.style.display === "block") requestAnimationFrame(anim); }
            anim();
        }

        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        canvas.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            if (timeLeft > 10) {
                if (goldenCapy && Math.hypot(e.clientX - goldenCapy.x, e.clientY - goldenCapy.y) < 65) { score += 10000; scoreEl.innerText = Math.floor(score); goldenCapy = null; }
                items.forEach(it => { if (Math.hypot(e.clientX - it.x, e.clientY - it.y) < 65) it.collect(); });
            } else {
                let d = Math.hypot(e.clientX - width/2, e.clientY - height/2);
                if (d < 220 * capySize) {
                    let val = multiplier; if (activeWeapon === 'mixer') score += val * 3; else if (activeWeapon === 'glove') score += val * 2; else score += val;
                    scoreEl.innerText = Math.floor(score); capySize = 1.3;
                }
            }
        });

        playBtn.addEventListener('click', () => {
            music.play(); score = 0; multiplier = 1.0; timeLeft = 45; items = []; nyanMode = 0; magnetTime = 0;
            goldenCapySpawns = [38, 25, 15]; goldenCapy = null; activeWeapon = null;
            weaponEl.innerText = ""; partyCanvas.style.display = "none";
            document.getElementById("main-title").innerText = "CAPYBARA CLICKER";
            document.getElementById("statsDisplay").style.display = "none";
            document.getElementById("instructions").style.display = "none";
            document.getElementById("gamble-screen").style.display = "none";
            menu.style.display = "none"; gameActive = true; lastTime = performance.now(); requestAnimationFrame(update);
        });

        restartBtn.addEventListener('click', () => location.reload()); // Helpoin tapa resetoida kaikki tilat
    </script>
</body>
</html>
