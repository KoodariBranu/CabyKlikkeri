<!DOCTYPE html>
<html>
<head>
    <title>Capybara Clicker: Assembly Legend Edition</title>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; user-select: none; }
        #game-container { position: relative; width: 100%; height: 100%; background: linear-gradient(#87CEEB, #E0F7FA); transition: background 0.5s; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 15px; left: 0; width: 100%; z-index: 10; text-align: center; pointer-events: none; }
        .stat-box { display: inline-block; background: rgba(255,255,255,0.8); padding: 10px 20px; border: 3px solid #5d4037; border-radius: 15px; font-size: 22px; color: #5d4037; font-weight: bold; margin: 0 5px; min-width: 130px; }
        #phase-msg { font-size: 45px; color: #fff; font-weight: bold; text-shadow: 3px 3px 0 #5d4037; margin-top: 15px; }
        #menu { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); z-index: 20; text-align: center; background: white; padding: 25px; border: 6px solid #8d6e63; border-radius: 25px; box-shadow: 0 10px 0 #5d4037; width: 90%; max-width: 420px; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 12px; font-weight: bold; margin: 8px; border: none; transition: 0.2s; }
        #playBtn { background: #4CAF50; color: white; box-shadow: 0 6px 0 #2E7D32; font-size: 24px; }
        #restartBtn { background: #f1c40f; color: #000; box-shadow: 0 5px 0 #b7950b; display: none; }
        .gamble-btn { background: #e74c3c; color: white; box-shadow: 0 6px 0 #c0392b; }
        .safe-btn { background: #3498db; color: white; box-shadow: 0 6px 0 #2980b9; }
        button:disabled { background: #ccc !important; box-shadow: none !important; cursor: not-allowed; opacity: 0.6; }
        .grass { position: absolute; bottom: 0; width: 100%; height: 100px; background: #7CFC00; z-index: 0; border-top: 10px solid #556B2F; }
        #party-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: none; }
        .shake { animation: shake 0.2s; }
        @keyframes shake { 0% { left: -8px; } 50% { left: 8px; } 100% { left: 0px; } }
        #weapon-ui { margin-top: 10px; display: flex; justify-content: center; gap: 10px; height: 35px; flex-wrap: wrap; }
        .weapon-tag { background: rgba(220, 20, 60, 0.9); color: #fff; padding: 5px 10px; border-radius: 10px; font-size: 13px; font-weight: bold; border: 1px solid #fff; }
        .highscore-flash { color: #f1c40f; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .gamble-score { font-size: 2.5em; color: #e67e22; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body style="display: flex; justify-content: center; align-items: center;">

    <div id="game-container">
        <div id="ui">
            <div class="stat-box">KERROIN: x<span id="multiplier">1.0</span></div>
            <div class="stat-box">PISTEET: <span id="score">0</span></div>
            <div class="stat-box">ENNÄTYS: <span id="highScore">0</span></div>
            <div class="stat-box">AIKA: <span id="timer">45</span>s</div>
            <div id="phase-msg"></div>
            <div id="weapon-ui"></div>
        </div>

        <div id="menu">
            <h1 id="main-title" style="color: #8d6e63; font-size: 1.8em; margin: 0;">CAPYBARA CLICKER</h1>
            <div id="instructions">
                <p>Kerää kertoimia ja aseita. Varo miinoja!<br>Voitko rikkoa ennätyksen?</p>
                <button id="playBtn">ALOITA!</button>
            </div>
            <div id="gamble-screen" style="display:none;">
                <h2>USKALLATKO TUPLATA?</h2>
                <div class="gamble-score" id="gamble-current-score">0</div>
                <button class="gamble-btn" id="gBtn1" onclick="handleGamble()">TUPLAA TAI KUITTAA</button>
                <button class="safe-btn" id="gBtn2" onclick="showResults()">OTA PISTEET TALTEEN</button>
            </div>
            <div id="statsDisplay" style="display:none;">
                <h2 id="finalScoreText" style="font-size: 2.5em; color: #5d4037; margin: 10px 0;">0</h2>
                <p id="rewardText" style="color: #4CAF50; font-size: 18px; font-weight: bold;"></p>
                <button id="restartBtn">PELAA UUDELLEEN</button>
            </div>
        </div>
        
        <div class="grass"></div>
        <canvas id="gameCanvas"></canvas>
        <canvas id="party-canvas"></canvas>
    </div>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    <audio id="nyanMusic" loop><source src="nyan.mp3" type="audio/mpeg"></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const partyCanvas = document.getElementById("party-canvas");
        const pCtx = partyCanvas.getContext("2d");
        const container = document.getElementById("game-container");
        const scoreEl = document.getElementById("score");
        const hsEl = document.getElementById("highScore");
        const multEl = document.getElementById("multiplier");
        const timerEl = document.getElementById("timer");
        const phaseEl = document.getElementById("phase-msg");
        const weaponUI = document.getElementById("weapon-ui");
        const playBtn = document.getElementById("playBtn");
        const restartBtn = document.getElementById("restartBtn");
        const menu = document.getElementById("menu");
        const music = document.getElementById("bgMusic");
        const nyanMusic = document.getElementById("nyanMusic");
        const gambleScoreDisplay = document.getElementById("gamble-current-score");

        let audioCtx;
        function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }

        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        let width, height, score, multiplier, timeLeft, gameActive, items, lastTime, magnetTime = 0, nyanMode = 0;
        let capySize = 1, mouseX = 0, mouseY = 0, goldenCapy = null;
        let hasMixer = false, hasGlove = false, hasWand = false;
        let goldenCapySpawns = [38, 25, 15]; 
        let isDoubleWin = false, wasNyan = false;

        let storedHighScore = localStorage.getItem("capyHighScore") || 0;
        hsEl.innerText = Math.floor(storedHighScore);

        function resize() {
            width = canvas.width = partyCanvas.width = window.innerWidth;
            height = canvas.height = partyCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize); resize();

        class FallingItem {
            constructor(type) {
                this.type = type; 
                if (hasWand && this.type === 'poop' && Math.random() < 0.1) { this.type = 'gold'; }
                this.x = Math.random() * (width - 60) + 30; this.y = -50;
                this.speed = Math.random() * 3 + 2.5; this.r = 30; this.collected = false;
                this.content = {poop:"💩", gold:"✨💩", magnet:"🧲", mine:"💣", mixer:"⚡", glove:"🥊", wand:"🪄"}[this.type];
            }
            update() {
                if (magnetTime > 0 && !['magnet', 'mine', 'mixer', 'glove', 'wand'].includes(this.type)) {
                    let dx = mouseX - this.x; let dy = mouseY - this.y; let dist = Math.hypot(dx, dy);
                    if (dist < 450) { this.x += (dx/dist)*25; this.y += (dy/dist)*25; if (dist < 40) this.collect(); }
                }
                this.y += nyanMode > 0 ? this.speed * 2.2 : this.speed;
            }
            draw() { if (!this.collected) { ctx.font = "40px Arial"; ctx.textAlign = "center"; ctx.fillText(this.content, this.x, this.y); } }
            collect() {
                if (this.collected) return; this.collected = true;
                if (this.type === 'mine') { 
                    multiplier = Math.max(1.0, multiplier - 5.0); 
                    hasMixer = hasGlove = hasWand = false;
                    weaponUI.innerHTML = ""; shakeScreen(); 
                    playTone(150, 'sawtooth', 0.5);
                } else {
                    playTone(this.type === 'gold' ? 800 : 400, 'sine', 0.1);
                    if (this.type === 'poop') multiplier += 0.2;
                    else if (this.type === 'gold') multiplier += 2.0;
                    else if (this.type === 'magnet') magnetTime = 6;
                    else if (this.type === 'wand') { hasWand = true; addWeaponTag("🪄 TAIKASAUVA"); }
                    else if (this.type === 'mixer' && !hasMixer) { hasMixer = true; addWeaponTag("⚡ VATKAIN"); }
                    else if (this.type === 'glove' && !hasGlove) { hasGlove = true; addWeaponTag("🥊 HANSKA"); }
                }
                multEl.innerText = multiplier.toFixed(1);
            }
        }

        function addWeaponTag(text) {
            const tag = document.createElement("div"); tag.className = "weapon-tag"; tag.innerText = text; weaponUI.appendChild(tag);
        }

        function update(time) {
            if (!gameActive) return;
            const dt = (time - lastTime) / 1000; lastTime = time; timeLeft -= dt;
            timerEl.innerText = Math.max(0, Math.ceil(timeLeft));
            if (timeLeft <= 0) return startGamblePhase();

            if (timeLeft > 10) {
                phaseEl.innerText = nyanMode > 0 ? "NYAN MODE!!!" : (magnetTime > 0 ? "🧲 MAGNEETTI" : "KERÄÄ KERROINTA");
                
                // MUSIIKIN VAIHTO LOGIIKKA
                if (nyanMode > 0) {
                    if (!wasNyan) { music.pause(); nyanMusic.play(); wasNyan = true; }
                } else {
                    if (wasNyan) { nyanMusic.pause(); nyanMusic.currentTime = 0; music.play(); wasNyan = false; }
                }

                if (Math.random() < (nyanMode > 0 ? 0.35 : 0.12)) {
                    let r = Math.random();
                    if (r < 0.003 && !hasMixer) items.push(new FallingItem('mixer'));
                    else if (r < 0.006 && !hasGlove) items.push(new FallingItem('glove'));
                    else if (r < 0.009 && !hasWand) items.push(new FallingItem('wand'));
                    else if (r < 0.015) items.push(new FallingItem('magnet'));
                    else if (r < 0.12) items.push(new FallingItem('mine'));
                    else if (r < 0.25) items.push(new FallingItem('gold'));
                    else items.push(new FallingItem('poop'));
                }
                if (timeLeft < 30 && Math.random() < 0.003 && nyanMode <= 0) nyanMode = 6;
                if (goldenCapySpawns.length > 0 && timeLeft <= goldenCapySpawns[0]) { goldenCapySpawns.shift(); goldenCapy = { x: -100, y: height - 60, speed: 9.5 }; }
                if (goldenCapy) { goldenCapy.x += goldenCapy.speed; if (goldenCapy.x > width + 150) goldenCapy = null; }
            } else { 
                phaseEl.innerText = "RÄMPYTÄ!!!"; container.style.background = "#FFD700"; items = []; goldenCapy = null; nyanMode = 0; 
                if (wasNyan) { nyanMusic.pause(); music.play(); wasNyan = false; }
            }

            if (nyanMode > 0) { nyanMode -= dt; container.style.background = `hsl(${(Date.now()/5) % 360}, 70%, 60%)`; }
            else if (timeLeft > 10) { container.style.background = "linear-gradient(#87CEEB, #E0F7FA)"; }
            if (magnetTime > 0) magnetTime -= dt;
            for (let i = items.length - 1; i >= 0; i--) { items[i].update(); if (items[i].y > height + 60 || items[i].collected) items.splice(i, 1); }
            draw(); requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            if (nyanMode > 0) {
                ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
                for(let i=0; i<10; i++) { let lx = (Math.random() * width); ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, height); ctx.stroke(); }
            }
            if (gameActive && timeLeft <= 10) {
                ctx.save(); ctx.translate(width/2, height/2); ctx.scale(capySize, capySize);
                ctx.fillStyle = "#8d6e63"; ctx.beginPath(); ctx.ellipse(0, 0, 160, 120, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(100, -40, 14, 0, Math.PI*2); ctx.fill();
                ctx.font = "40px Arial";
                if (hasMixer) ctx.fillText("⚡", -140, -40); if (hasGlove) ctx.fillText("🥊", -140, 40); if (hasWand) ctx.fillText("🪄", -140, 0);
                ctx.restore(); if (capySize > 1) capySize -= 0.1;
            } else if (gameActive) {
                items.forEach(it => it.draw());
                if (goldenCapy) {
                    ctx.save(); ctx.translate(goldenCapy.x, goldenCapy.y); ctx.fillStyle = "#FFD700";
                    ctx.beginPath(); ctx.ellipse(0, 0, 45, 33, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#FF0000"; ctx.beginPath(); ctx.moveTo(-10, -32); ctx.lineTo(0, -50); ctx.lineTo(10, -32); ctx.fill(); ctx.restore();
                }
            }
        }

        function startGamblePhase() {
            gameActive = false; music.pause(); nyanMusic.pause(); menu.style.display = "block";
            document.getElementById("instructions").style.display = "none";
            document.getElementById("gamble-screen").style.display = "block";
            gambleScoreDisplay.innerText = Math.floor(score);
            const g1 = document.getElementById("gBtn1"); const g2 = document.getElementById("gBtn2");
            g1.disabled = g2.disabled = true; setTimeout(() => { g1.disabled = g2.disabled = false; }, 1500);
        }

        window.handleGamble = function() {
            const win = Math.random() > 0.5;
            if (win) { score *= 2; isDoubleWin = true; playTone(600, 'sine', 0.3); alert("VOITTO! Pisteet tuplattu!"); }
            else { score /= 2; playTone(200, 'square', 0.4); alert("HÄVIÖ! Puolet meni."); }
            showResults();
        }

        window.showResults = function() {
            document.getElementById("gamble-screen").style.display = "none";
            document.getElementById("statsDisplay").style.display = "block";
            document.getElementById("finalScoreText").innerText = Math.floor(score);
            if (score > storedHighScore) {
                storedHighScore = score; localStorage.setItem("capyHighScore", storedHighScore);
                hsEl.innerText = Math.floor(storedHighScore);
                document.getElementById("rewardText").innerText = "UUSI ENNÄTYS!!! 🏆";
                hsEl.parentElement.classList.add("highscore-flash");
                startParty(); 
            } else if (isDoubleWin) {
                document.getElementById("rewardText").innerText = "RISKIVOITTO! ✨";
                startParty(); 
            } else {
                document.getElementById("rewardText").innerText = score >= 100000 ? "✨ ULTIMATE CAPY GOD ✨" : "Hyvä peli!";
                if (score >= 100000) startParty();
            }
            setTimeout(() => { restartBtn.style.display = "inline-block"; }, 1000);
        }

        function startParty() {
            partyCanvas.style.display = "block"; let particles = [];
            for(let i=0; i<200; i++) particles.push({ x: Math.random()*width, y: Math.random()*height, s: Math.random()*6+2, c: `hsl(${Math.random()*360}, 100%, 50%)`, v: Math.random()*12+5 });
            function anim() { pCtx.clearRect(0, 0, width, height); particles.forEach(p => { p.y += p.v; if (p.y > height) p.y = -10; pCtx.fillStyle = p.c; pCtx.fillRect(p.x, p.y, p.s, p.s); }); if (partyCanvas.style.display === "block") requestAnimationFrame(anim); }
            anim();
        }

        function shakeScreen() { container.classList.add("shake"); setTimeout(() => container.classList.remove("shake"), 200); }

        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        canvas.addEventListener('mousedown', (e) => {
            initAudio();
            if (!gameActive) return;
            if (timeLeft > 10) {
                if (goldenCapy && Math.hypot(e.clientX - goldenCapy.x, e.clientY - goldenCapy.y) < 65) { 
                    score += 10000; scoreEl.innerText = Math.floor(score); goldenCapy = null; 
                    playTone(900, 'sine', 0.2);
                }
                items.forEach(it => { if (Math.hypot(e.clientX - it.x, e.clientY - it.y) < 65) it.collect(); });
            } else {
                let d = Math.hypot(e.clientX - width/2, e.clientY - height/2);
                if (d < 220 * capySize) {
                    let val = multiplier; let s = 1;
                    if (hasMixer) s *= 3; if (hasGlove) s *= 2;
                    score += val * s; scoreEl.innerText = Math.floor(score); capySize = 1.3;
                    playTone(200 + (multiplier * 5), 'sine', 0.05);
                }
            }
        });

        playBtn.addEventListener('click', () => {
            initAudio();
            music.play().catch(e => console.log("Blocked"));
            resetGame();
        });

        function resetGame() {
            score = 0; multiplier = 1.0; timeLeft = 45; items = []; nyanMode = 0; magnetTime = 0; isDoubleWin = false; wasNyan = false;
            goldenCapySpawns = [38, 25, 15]; goldenCapy = null; 
            hasMixer = hasGlove = hasWand = false; weaponUI.innerHTML = "";
            partyCanvas.style.display = "none"; scoreEl.innerText = "0"; multEl.innerText = "1.0";
            document.getElementById("main-title").innerText = "CAPYBARA CLICKER";
            document.getElementById("statsDisplay").style.display = "none";
            document.getElementById("instructions").style.display = "none";
            document.getElementById("gamble-screen").style.display = "none";
            restartBtn.style.display = "none"; menu.style.display = "none";
            hsEl.parentElement.classList.remove("highscore-flash");
            gameActive = true; lastTime = performance.now(); requestAnimationFrame(update);
        }

        restartBtn.addEventListener('click', resetGame);
    </script>
</body>
</html>
