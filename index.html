<!DOCTYPE html>
<html>
<head>
    <title>Capybara Clicker: Audio Edition</title>
    <style>
        /* (Pidetään samat tyylit kuin aiemmin) */
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; user-select: none; }
        #game-container { position: relative; width: 100%; height: 100%; background: linear-gradient(#87CEEB, #E0F7FA); transition: background 0.5s; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 15px; left: 0; width: 100%; z-index: 10; text-align: center; pointer-events: none; }
        .stat-box { display: inline-block; background: rgba(255,255,255,0.8); padding: 10px 20px; border: 3px solid #5d4037; border-radius: 15px; font-size: 22px; color: #5d4037; font-weight: bold; margin: 0 5px; min-width: 130px; }
        #phase-msg { font-size: 45px; color: #fff; font-weight: bold; text-shadow: 3px 3px 0 #5d4037; margin-top: 15px; }
        #menu { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); z-index: 20; text-align: center; background: white; padding: 25px; border: 6px solid #8d6e63; border-radius: 25px; box-shadow: 0 10px 0 #5d4037; width: 90%; max-width: 420px; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 12px; font-weight: bold; margin: 8px; border: none; transition: 0.2s; }
        #playBtn { background: #4CAF50; color: white; box-shadow: 0 6px 0 #2E7D32; font-size: 24px; }
        #restartBtn { background: #f1c40f; color: #000; box-shadow: 0 5px 0 #b7950b; display: none; }
        .gamble-btn { background: #e74c3c; color: white; box-shadow: 0 6px 0 #c0392b; }
        .safe-btn { background: #3498db; color: white; box-shadow: 0 6px 0 #2980b9; }
        .grass { position: absolute; bottom: 0; width: 100%; height: 100px; background: #7CFC00; z-index: 0; border-top: 10px solid #556B2F; }
        #party-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: none; }
        .weapon-tag { background: rgba(220, 20, 60, 0.9); color: #fff; padding: 5px 10px; border-radius: 10px; font-size: 13px; font-weight: bold; border: 1px solid #fff; }
        .highscore-flash { color: #f1c40f; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div class="stat-box">KERROIN: x<span id="multiplier">1.0</span></div>
            <div class="stat-box">PISTEET: <span id="score">0</span></div>
            <div class="stat-box">ENNÄTYS: <span id="highScore">0</span></div>
            <div class="stat-box">AIKA: <span id="timer">45</span>s</div>
            <div id="phase-msg"></div>
            <div id="weapon-ui"></div>
        </div>

        <div id="menu">
            <h1 id="main-title" style="color: #8d6e63; font-size: 1.8em; margin: 0;">CAPYBARA CLICKER</h1>
            <div id="instructions">
                <p>Musiikki käynnistyy napista!<br>Kerää kertoimia ja rämpytä!</p>
                <button id="playBtn">ALOITA MUSIIKILLA!</button>
            </div>
            <div id="gamble-screen" style="display:none;">
                <h2>USKALLATKO TUPLATA?</h2>
                <div id="gamble-current-score" style="font-size: 2.5em; color: #e67e22; font-weight: bold;">0</div>
                <button class="gamble-btn" onclick="handleGamble()">TUPLAA TAI KUITTAA</button>
                <button class="safe-btn" onclick="showResults()">OTA PISTEET</button>
            </div>
            <div id="statsDisplay" style="display:none;">
                <h2 id="finalScoreText" style="font-size: 2.5em; color: #5d4037;">0</h2>
                <p id="rewardText"></p>
                <button id="restartBtn">PELAA UUDELLEEN</button>
            </div>
        </div>
        
        <div class="grass"></div>
        <canvas id="gameCanvas"></canvas>
        <canvas id="party-canvas"></canvas>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const partyCanvas = document.getElementById("party-canvas");
        const pCtx = partyCanvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const hsEl = document.getElementById("highScore");
        const multEl = document.getElementById("multiplier");
        const timerEl = document.getElementById("timer");
        const phaseEl = document.getElementById("phase-msg");
        const weaponUI = document.getElementById("weapon-ui");
        const music = document.getElementById("bgMusic");

        // ÄÄNIEFEKTI-GENERAATTORI (Ei tarvitse tiedostoja!)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        let width, height, score, multiplier, timeLeft, gameActive, items, lastTime;
        let hasMixer, hasGlove, hasWand, isDoubleWin, magnetTime, nyanMode;
        let storedHighScore = localStorage.getItem("capyHighScore") || 0;
        hsEl.innerText = Math.floor(storedHighScore);

        function resize() { width = canvas.width = partyCanvas.width = window.innerWidth; height = canvas.height = partyCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class FallingItem {
            constructor(type) {
                this.type = type;
                if (hasWand && this.type === 'poop' && Math.random() < 0.1) this.type = 'gold';
                this.x = Math.random() * (width - 60) + 30; this.y = -50;
                this.speed = Math.random() * 3 + 2.5; this.collected = false;
                this.content = {poop:"💩", gold:"✨💩", magnet:"🧲", mine:"💣", mixer:"⚡", glove:"🥊", wand:"🪄"}[this.type];
            }
            update() { this.y += nyanMode > 0 ? this.speed * 2.2 : this.speed; }
            draw() { if (!this.collected) { ctx.font = "40px Arial"; ctx.textAlign = "center"; ctx.fillText(this.content, this.x, this.y); } }
            collect() {
                if (this.collected) return; this.collected = true;
                if (this.type === 'mine') {
                    multiplier = Math.max(1.0, multiplier - 5.0); playTone(150, 'sawtooth', 0.5);
                } else {
                    playTone(this.type === 'gold' ? 800 : 400, 'sine', 0.1);
                    if (this.type === 'poop') multiplier += 0.2;
                    if (this.type === 'gold') multiplier += 2.0;
                    if (this.type === 'wand') hasWand = true;
                }
                multEl.innerText = multiplier.toFixed(1);
            }
        }

        function update(time) {
            if (!gameActive) return;
            const dt = (time - lastTime) / 1000; lastTime = time; timeLeft -= dt;
            timerEl.innerText = Math.max(0, Math.ceil(timeLeft));
            if (timeLeft <= 0) return startGamblePhase();
            
            if (Math.random() < 0.12 && timeLeft > 10) {
                items.push(new FallingItem(Math.random() < 0.1 ? 'gold' : (Math.random() < 0.1 ? 'mine' : 'poop')));
            }
            
            for (let i = items.length - 1; i >= 0; i--) { items[i].update(); if (items[i].y > height + 60 || items[i].collected) items.splice(i, 1); }
            draw(); requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            if (timeLeft > 10) { items.forEach(it => it.draw()); }
            else {
                ctx.fillStyle = "#8d6e63"; ctx.beginPath(); ctx.ellipse(width/2, height/2, 160, 120, 0, 0, Math.PI*2); ctx.fill();
            }
        }

        function startGamblePhase() { gameActive = false; music.volume = 0.3; document.getElementById("menu").style.display = "block"; document.getElementById("instructions").style.display = "none"; document.getElementById("gamble-screen").style.display = "block"; document.getElementById("gamble-current-score").innerText = Math.floor(score); }

        window.handleGamble = function() {
            if (Math.random() > 0.5) { score *= 2; isDoubleWin = true; playTone(600, 'sine', 0.3); }
            else { score /= 2; playTone(200, 'square', 0.4); }
            showResults();
        };

        window.showResults = function() {
            document.getElementById("gamble-screen").style.display = "none";
            document.getElementById("statsDisplay").style.display = "block";
            document.getElementById("finalScoreText").innerText = Math.floor(score);
            if (score > storedHighScore) { localStorage.setItem("capyHighScore", score); hsEl.innerText = Math.floor(score); startParty(); }
            else if (isDoubleWin) startParty();
            document.getElementById("restartBtn").style.display = "inline-block";
        };

        function startParty() { partyCanvas.style.display = "block"; /* (Bilelogiikka tähän) */ }

        canvas.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            if (timeLeft <= 10) {
                score += multiplier; scoreEl.innerText = Math.floor(score);
                playTone(200 + (multiplier * 10), 'sine', 0.05);
            } else {
                items.forEach(it => { if (Math.hypot(e.clientX - it.x, e.clientY - it.y) < 60) it.collect(); });
            }
        });

        document.getElementById("playBtn").addEventListener('click', () => {
            audioCtx.resume(); // Aktivoi äänet
            music.play();
            resetGame();
        });

        document.getElementById("restartBtn").addEventListener('click', resetGame);

        function resetGame() {
            score = 0; multiplier = 1.0; timeLeft = 45; items = []; gameActive = true; isDoubleWin = false;
            document.getElementById("menu").style.display = "none";
            lastTime = performance.now(); requestAnimationFrame(update);
        }
    </script>
</body>
</html>
